[project]
name = "caulong-backend"
version = "0.1.0"
description = "API quản lý & đặt sân cầu lông"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Không dùng uvicorn[standard]: extra đó kéo theo pyyaml (dự án không dùng),
    # gói chưa có wheel Windows cho Python 3.15 -> cần MSVC để build.
    "uvicorn>=0.30",
    "uvloop>=0.21; sys_platform != 'win32'",
    "httptools>=0.6",
    "watchfiles>=0.22",  # uvicorn --reload
    "colorama>=0.4; sys_platform == 'win32'",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "pwdlib[argon2]>=0.2",
    "arq>=0.26",
    "redis>=5.0",
    "python-slugify>=8.0",
    "tzdata>=2024.1",  # Windows không có sẵn IANA tz database
    "cryptography>=44",  # mã hóa khóa webhook SePay lưu trong DB (T-012, Fernet)
    "pillow>=11",  # ảnh đại diện hội viên: giải mã + mã hóa lại (T-016, ADR-009 §5)
    "python-multipart>=0.0.9",  # FastAPI nhận tệp tải lên (multipart/form-data)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
