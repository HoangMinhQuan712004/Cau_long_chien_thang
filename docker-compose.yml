services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: caulong
      POSTGRES_PASSWORD: caulong
      POSTGRES_DB: caulong
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caulong"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://caulong:caulong@db:5432/caulong
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["app"]

  worker:
    build: ./backend
    command: arq app.workers.worker.WorkerSettings
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://caulong:caulong@db:5432/caulong
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["app"]

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    profiles: ["app"]

volumes:
  pgdata:
