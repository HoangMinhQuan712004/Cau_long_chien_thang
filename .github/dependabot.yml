version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    target-branch: dev
    schedule: { interval: monthly }
