name: CD

# Chỉ chạy khi CI trên main đã xanh (hoặc chạy tay từ tab Actions)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Commit đã qua CI (workflow_run) hoặc commit hiện tại (chạy tay)
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Build & push ${{ matrix.name }} image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ env.SHA }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Chỉ image web dùng; rewrites /api/v1 được tính lúc build
          build-args: |
            BACKEND_URL=http://api:8000
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to server
    needs: images
    # Bật bằng repository variable DEPLOY_ENABLED=true sau khi đã cấu hình server + secrets
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull images & restart
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/caulong' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o BatchMode=yes $TARGET"
          IMAGE_PREFIX=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')

          scp -i ~/.ssh/id_deploy -o BatchMode=yes deploy/docker-compose.prod.yml "$TARGET:$DEPLOY_PATH/docker-compose.yml"
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # Ghi tag đang chạy vào .env để `docker compose up -d` chạy tay trên server dùng đúng image
          $SSH "cd '$DEPLOY_PATH' \
            && export IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$SHA' \
            && docker compose pull api worker web \
            && sed -i '/^IMAGE_PREFIX=/d;/^IMAGE_TAG=/d' .env \
            && printf 'IMAGE_PREFIX=%s\nIMAGE_TAG=%s\n' \"\$IMAGE_PREFIX\" \"\$IMAGE_TAG\" >> .env \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"

      - name: Smoke test
        if: vars.SITE_URL != ''
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ vars.SITE_URL }}/robots.txt" > /dev/null && exit 0
            sleep 5
          done
          echo "::error::Website không phản hồi sau khi deploy"
          exit 1
