name: CD

# Chỉ chạy khi CI trên main hoặc dev đã xanh (hoặc chạy tay từ tab Actions)
#   dev  -> môi trường dev        (https://chienthang-dev.superbai.vip, /opt/caulong-dev, project caulong-dev)
#   main -> môi trường production (như cũ)
# Lưu ý: workflow_run luôn dùng file workflow trên default branch của repo.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Môi trường deploy (production chỉ cho phép chạy từ main)
        type: choice
        options: [dev, production]
        default: dev

# Mỗi môi trường một hàng đợi riêng: deploy dev không chặn production
concurrency:
  group: cd-${{ inputs.environment || (github.event.workflow_run.head_branch == 'dev' && 'dev' || 'production') }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Commit đã qua CI (workflow_run) hoặc commit hiện tại (chạy tay)
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  target:
    name: Select environment
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
      tag_prefix: ${{ steps.pick.outputs.tag_prefix }}
      floating_tag: ${{ steps.pick.outputs.floating_tag }}
      project: ${{ steps.pick.outputs.project }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            NAME="$INPUT_ENV"
            if [ "$NAME" = production ] && [ "$REF_NAME" != main ]; then
              echo "::error::Production chỉ deploy từ nhánh main (đang chạy từ '$REF_NAME')"
              exit 1
            fi
          elif [ "$HEAD_BRANCH" = dev ]; then
            NAME=dev
          else
            NAME=production
          fi
          if [ "$NAME" = dev ]; then
            { echo "name=dev"; echo "tag_prefix=dev-"; echo "floating_tag=dev"; echo "project=caulong-dev"; } >> "$GITHUB_OUTPUT"
          else
            { echo "name=production"; echo "tag_prefix="; echo "floating_tag=latest"; echo "project=caulong"; } >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Build & push ${{ matrix.name }} image
    needs: target
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.target.outputs.tag_prefix }}${{ env.SHA }}
            type=raw,value=${{ needs.target.outputs.floating_tag }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Chỉ image web dùng; rewrites /api/v1 được tính lúc build
          build-args: |
            BACKEND_URL=http://api:8000
            NEXT_PUBLIC_SITE_URL=${{ (needs.target.outputs.name == 'dev' && (vars.DEV_SITE_URL || 'https://chienthang-dev.superbai.vip')) || vars.SITE_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ needs.target.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ needs.target.outputs.name }}

  deploy:
    name: Deploy to server
    needs: [target, images]
    # Bật bằng repository variable DEPLOY_ENABLED=true sau khi đã cấu hình server + secrets
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Environment `dev` / `production` giữ secret SSH riêng (DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_USER, DEPLOY_HOST)
    environment: ${{ needs.target.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull images & restart
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          # Dev cố định /opt/caulong-dev (không lấy repo var DEPLOY_PATH để không lỡ chạm thư mục production)
          DEPLOY_PATH: ${{ needs.target.outputs.name == 'dev' && '/opt/caulong-dev' || vars.DEPLOY_PATH || '/opt/caulong' }}
          PROJECT: ${{ needs.target.outputs.project }}
          TAG_PREFIX: ${{ needs.target.outputs.tag_prefix }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o BatchMode=yes $TARGET"
          IMAGE_PREFIX=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')

          scp -i ~/.ssh/id_deploy -o BatchMode=yes deploy/docker-compose.prod.yml "$TARGET:$DEPLOY_PATH/docker-compose.yml"
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # Ghi tag đang chạy vào .env để `docker compose up -d` chạy tay trên server dùng đúng image
          $SSH "cd '$DEPLOY_PATH' \
            && export IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='${TAG_PREFIX}${SHA}' \
            && docker compose -p '$PROJECT' pull api worker web \
            && sed -i '/^IMAGE_PREFIX=/d;/^IMAGE_TAG=/d' .env \
            && printf 'IMAGE_PREFIX=%s\nIMAGE_TAG=%s\n' \"\$IMAGE_PREFIX\" \"\$IMAGE_TAG\" >> .env \
            && docker compose -p '$PROJECT' up -d --remove-orphans \
            && docker image prune -f"

      - name: Smoke test
        if: needs.target.outputs.name == 'dev' || vars.SITE_URL != ''
        env:
          URL: ${{ (needs.target.outputs.name == 'dev' && (vars.DEV_SITE_URL || 'https://chienthang-dev.superbai.vip')) || vars.SITE_URL }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$URL/robots.txt" > /dev/null && exit 0
            sleep 5
          done
          echo "::error::Website không phản hồi sau khi deploy"
          exit 1
