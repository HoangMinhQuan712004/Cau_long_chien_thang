# Compose cho server production, dùng image build sẵn trên GHCR.
# CD workflow copy file này lên server thành $DEPLOY_PATH/docker-compose.yml
# và chạy với IMAGE_TAG = commit SHA. Biến môi trường đọc từ $DEPLOY_PATH/.env.
name: caulong

x-backend: &backend
  image: ${IMAGE_PREFIX:-ghcr.io/hoangminhquan712004/cau_long_chien_thang}-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    # Mặc định production. Chỉ link dev đặt APP_ENV=staging trong .env để bật PAYMENTS_SIMULATE (T-008);
    # KHÔNG đặt APP_ENV trên production.
    ENV: ${APP_ENV:-production}
    DATABASE_URL: postgresql+asyncpg://caulong:${POSTGRES_PASSWORD}@db:5432/caulong
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: caulong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: caulong
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caulong"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    <<: *backend
    # CMD của image chạy `alembic upgrade head` trước khi start uvicorn
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: arq app.workers.worker.WorkerSettings

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/hoangminhquan712004/cau_long_chien_thang}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    # Chỉ mở cho localhost; đặt Caddy/Nginx phía trước để có HTTPS
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
